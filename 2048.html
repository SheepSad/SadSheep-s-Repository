<!DOCTYPE html>
<html lang="zh-CN" data-preset="graphite">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e9ec" id="metaTheme">
<title>2048 · 单文件版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d1d1f'/%3E%3Crect x='5' y='5' width='9.5' height='9.5' rx='3' fill='%23fff' opacity='.92'/%3E%3Crect x='17.5' y='5' width='9.5' height='9.5' rx='3' fill='%23fff' opacity='.45'/%3E%3Crect x='5' y='17.5' width='9.5' height='9.5' rx='3' fill='%23fff' opacity='.45'/%3E%3Crect x='17.5' y='17.5' width='9.5' height='9.5' rx='3' fill='%23fff' opacity='.92'/%3E%3C/svg%3E">
<style>
/* =========================================================================
   2048 · 新拟物（Neumorphism）× Apple 视觉语言
   -------------------------------------------------------------------------
   配色不写死在 CSS 里，而是由 JS 按「预设 + 自定义颜色」计算成一组
   自定义属性挂到 <html> 上。下面 :root 里的值是默认预设「石墨白」的
   副本，作用只是保证 JS 执行前首屏不会闪一下未上色的样式。
   ========================================================================= */
:root{
  /* 尺寸令牌（与配色无关） */
  --anim: 110ms;
  --radius: 10px;
  --radius-lg: 18px;
  --board: min(92vw, 440px, 68svh);

  /* 默认（石墨白）配色 */
  --bg:#e9e9ec;
  --bg-2:#f4f4f6;
  --surface:#ecedf0;
  --surface-2:#e0e0e5;
  --board-bg:#e3e3e8;
  --cell-bg:#dcdce1;
  --text:#1d1d1f;
  --text-dim:#86868b;
  --accent:#2c2c2e;
  --accent-2:#5a5a5e;
  --accent-fg:#ffffff;
  --line:rgba(0,0,0,.06);
  --sh-dark:rgba(163,163,170,.62);
  --sh-light:rgba(255,255,255,.96);

  --raise:6px 6px 15px var(--sh-dark), -6px -6px 15px var(--sh-light);
  --raise-sm:3px 3px 8px var(--sh-dark), -2px -2px 6px var(--sh-light);
  --inset:inset 4px 4px 9px var(--sh-dark), inset -3px -3px 8px var(--sh-light);
  --tile-shadow:3px 3px 7px var(--sh-dark), -2px -2px 5px var(--sh-light);

  --t2:#e6e6ea;   --f2:#55555b;
  --t4:#dedee3;   --f4:#4b4b51;
  --t8:#d2d2d8;   --f8:#414147;
  --t16:#c3c3ca;  --f16:#34343a;
  --t32:#adadb5;  --f32:#26262b;
  --t64:#87878f;  --f64:#ffffff;
  --t128:#7a7a85; --f128:#ffffff;
  --t256:#666670; --f256:#ffffff;
  --t512:#52525b; --f512:#ffffff;
  --t1024:#3d3d45;--f1024:#ffffff;
  --t2048:#26262c;--f2048:#ffffff;
  --tsuper:#000000;--fsuper:#ffffff;
}
@supports not (height: 100svh){
  :root{ --board: min(92vw, 440px, 68vh); }
}

/* =========================================================================
   1. 基础
   ========================================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;padding:14px;
  min-height:100vh; min-height:100svh;
  display:flex;justify-content:center;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color .45s ease,color .45s ease;
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}

/* 背景氛围光晕
   数量、颜色、位置全部由 JS 按预设写进这 5 个 <i>：深空黑一个都不用，
   赛博霓虹用满 5 团不同颜色的霓虹光。DOM 固定 5 个复用（而不是按需增删），
   这样切换预设时颜色是渐变过渡的，不会硬跳。 */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{
  position:absolute;display:block;border-radius:50%;
  background:transparent;filter:blur(56px);
  transition:background-color .5s ease;
}

.app{
  position:relative;z-index:1;
  width:min(92vw,440px);margin:auto;
  display:flex;flex-direction:column;gap:12px;
}

/* =========================================================================
   2. 顶栏
   ========================================================================= */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{
  margin:0;font-size:36px;line-height:1;letter-spacing:-.045em;font-weight:800;
  background:linear-gradient(135deg,var(--text) 12%,var(--accent) 92%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  transition:background .45s ease;
}
.brand p{margin:6px 0 0;font-size:12.5px;color:var(--text-dim);letter-spacing:.01em}

.actions{display:flex;gap:10px}
/* 新拟物凸起按钮：平面化自绘图标，颜色跟随强调色 */
.icon-btn{
  width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;
  border:0;border-radius:14px;cursor:pointer;
  background:var(--surface);color:var(--accent);
  box-shadow:var(--raise-sm);
  transition:box-shadow .18s ease,transform .14s ease,color .45s ease,background-color .45s ease;
}
.icon-btn svg{width:21px;height:21px;display:block}
.icon-btn:hover{color:var(--accent-2)}
.icon-btn:active{
  transform:translateY(1px);
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -2px -2px 5px var(--sh-light);
}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* =========================================================================
   3. 数据面板
   ========================================================================= */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  position:relative;
  background:var(--surface);border-radius:15px;
  padding:10px 12px 11px;
  display:flex;flex-direction:column;gap:3px;
  box-shadow:var(--raise-sm);
  transition:background-color .45s ease,box-shadow .45s ease;
}
.stat .label{font-size:10px;letter-spacing:.16em;color:var(--text-dim);text-transform:uppercase;font-weight:600}
.stat .value{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score-add{
  position:absolute;right:12px;top:8px;font-size:13px;font-weight:800;color:var(--accent);
  pointer-events:none;animation:floatUp .75s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes floatUp{
  from{opacity:1;transform:translateY(4px) scale(.9)}
  30%{opacity:1;transform:translateY(-4px) scale(1.1)}
  to{opacity:0;transform:translateY(-24px) scale(1)}
}

/* =========================================================================
   4. 按钮
   ========================================================================= */
.toolbar{display:flex;gap:10px}
.btn{
  appearance:none;flex:1;cursor:pointer;
  padding:12px 16px;border-radius:14px;font-size:14px;font-weight:650;
  font-family:inherit;letter-spacing:.01em;
  border:0;background:var(--surface);color:var(--text);
  box-shadow:var(--raise-sm);
  transition:box-shadow .18s ease,transform .14s ease,background-color .45s ease,color .45s ease;
}
.btn:hover{color:var(--accent)}
.btn:active{
  transform:translateY(1px);
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -2px -2px 5px var(--sh-light);
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--accent-fg);
  box-shadow:0 8px 20px -8px var(--accent), var(--raise-sm);
}
.btn.primary:hover{color:var(--accent-fg);filter:brightness(1.07)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--text-dim)}
.btn.ghost:hover{color:var(--accent);box-shadow:none}
.btn.ghost:active{transform:none;box-shadow:none}

/* =========================================================================
   5. 棋盘与方块
   ========================================================================= */
.board{
  position:relative;margin:0 auto;
  width:var(--board);height:var(--board);
  background:var(--board-bg);border-radius:var(--radius-lg);
  box-shadow:var(--inset), 0 1px 0 var(--sh-light);
  touch-action:none;
  transition:background-color .45s ease,box-shadow .45s ease;
  --pad:calc(var(--board) * .032);
  --gap:calc(var(--board) * .032);
  --cell:calc((var(--board) - var(--pad) * 2 - var(--gap) * 3) / 4);
}
.cells{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  gap:var(--gap);padding:var(--pad);
}
.cell{
  background:var(--cell-bg);border-radius:var(--radius);
  box-shadow:inset 2px 2px 5px var(--sh-dark), inset -1px -1px 3px var(--sh-light);
  transition:background-color .45s ease,box-shadow .45s ease;
}

.tiles{position:absolute;inset:0;pointer-events:none}
.tile{
  position:absolute;
  left:var(--pad);top:var(--pad);
  width:var(--cell);height:var(--cell);
  z-index:1;
  transform:translate(
    calc(var(--x) * (var(--cell) + var(--gap))),
    calc(var(--y) * (var(--cell) + var(--gap)))
  );
  transition:transform var(--anim) cubic-bezier(.22,.75,.28,1);
  will-change:transform;
}
.tile[data-dead="1"]{z-index:3}

.tile-inner{
  width:100%;height:100%;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  background:var(--tb,#8a90a0);color:var(--tf,#fff);
  box-shadow:var(--tile-shadow);
  transform-origin:center;
  transition:background-color .4s ease,color .4s ease,box-shadow .4s ease;
  will-change:transform;
}

.tile[data-v="2"]   {--tb:var(--t2);   --tf:var(--f2)}
.tile[data-v="4"]   {--tb:var(--t4);   --tf:var(--f4)}
.tile[data-v="8"]   {--tb:var(--t8);   --tf:var(--f8)}
.tile[data-v="16"]  {--tb:var(--t16);  --tf:var(--f16)}
.tile[data-v="32"]  {--tb:var(--t32);  --tf:var(--f32)}
.tile[data-v="64"]  {--tb:var(--t64);  --tf:var(--f64)}
.tile[data-v="128"] {--tb:var(--t128); --tf:var(--f128)}
.tile[data-v="256"] {--tb:var(--t256); --tf:var(--f256)}
.tile[data-v="512"] {--tb:var(--t512); --tf:var(--f512)}
.tile[data-v="1024"]{--tb:var(--t1024);--tf:var(--f1024)}
.tile[data-v="2048"]{--tb:var(--t2048);--tf:var(--f2048)}
.tile[data-v="super"]{--tb:var(--tsuper);--tf:var(--fsuper)}

@keyframes appear{
  from{transform:scale(.25);opacity:0}
  to{transform:scale(1);opacity:1}
}
@keyframes pop{
  0%{transform:scale(.2)}
  55%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,0),0 0 0 rgba(255,255,255,0)}
  30%{box-shadow:0 0 0 5px rgba(255,255,255,.42),0 0 26px rgba(255,255,255,.55)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0),0 0 0 rgba(255,255,255,0)}
}
.tile.new .tile-inner{
  animation:appear 155ms cubic-bezier(.2,.9,.3,1.45) both;
}
.tile.merged .tile-inner{
  animation:
    pop 190ms cubic-bezier(.2,.9,.3,1.35) calc(var(--anim) * .8) both,
    flash 400ms ease calc(var(--anim) * .8) both;
}

.hint{margin:2px 0 0;text-align:center;font-size:12px;color:var(--text-dim);letter-spacing:.02em}
.hint kbd{
  font:inherit;font-weight:700;color:var(--text);
  background:var(--surface);border-radius:7px;padding:2px 6px;
  box-shadow:var(--raise-sm);
}

/* =========================================================================
   6. 弹窗
   ========================================================================= */
.overlay{
  position:fixed;inset:0;z-index:50;padding:18px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.42);
  background:color-mix(in srgb, var(--bg) 45%, rgba(0,0,0,.62));
  -webkit-backdrop-filter:blur(10px) saturate(120%);backdrop-filter:blur(10px) saturate(120%);
  opacity:0;pointer-events:none;transition:opacity .26s ease;
}
.overlay.show{opacity:1;pointer-events:auto}
.card{
  width:min(420px,100%);max-height:88svh;overflow:auto;
  background:var(--surface);border-radius:24px;
  padding:26px 22px;text-align:center;
  box-shadow:var(--raise), 0 30px 70px -30px rgba(0,0,0,.5);
  transform:translateY(16px) scale(.94);opacity:.5;
  transition:transform .34s cubic-bezier(.2,.9,.3,1.3),opacity .3s ease,background-color .45s ease;
  -webkit-overflow-scrolling:touch;
}
.overlay.show .card{transform:none;opacity:1}
.card h2{margin:0 0 6px;font-size:22px;letter-spacing:-.025em;font-weight:750}
.card .muted{margin:0 0 16px;font-size:13px;color:var(--text-dim);line-height:1.6}
.card .big{
  font-size:46px;font-weight:850;letter-spacing:-.04em;line-height:1.1;margin:8px 0 14px;
  background:linear-gradient(135deg,var(--text) 10%,var(--accent) 95%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
/* 弹窗顶部徽记：新拟物凹槽 + 自绘平面图标 */
.mark{
  width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;
  border-radius:20px;background:var(--surface);color:var(--accent);
  box-shadow:var(--raise-sm);
  animation:pop 500ms cubic-bezier(.2,.9,.3,1.4) both;
}
.mark svg{width:30px;height:30px;display:block}
.card-actions{display:flex;gap:10px;margin-top:20px}
.card-actions .btn{flex:1}

ul.hist{list-style:none;margin:0;padding:0;max-height:42svh;overflow:auto;text-align:left}
ul.hist li{
  display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;
  padding:10px 12px;border-radius:13px;margin-bottom:7px;
  background:var(--surface);box-shadow:var(--raise-sm);
  font-size:13px;
}
ul.hist li .idx{color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums}
ul.hist li .sc{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
ul.hist li .meta{color:var(--text-dim);font-size:11px;white-space:nowrap;line-height:1.5}
ul.hist li.empty{display:block;text-align:center;color:var(--text-dim);box-shadow:var(--inset)}

/* ---- 外观设置弹窗 ---- */
.set{text-align:left}
.set-head{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.set-head .mark{margin:0;width:50px;height:50px;border-radius:16px;flex:0 0 auto}
.set-head .mark svg{width:24px;height:24px}
.set-head h2{margin:0 0 2px;font-size:19px}
.set-head p{margin:0;font-size:12px;color:var(--text-dim)}

.set-title{
  margin:20px 0 11px;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-dim);
}
.set-title:first-of-type{margin-top:0}

.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.preset{
  position:relative;cursor:pointer;text-align:left;font-family:inherit;
  border:0;border-radius:16px;padding:11px;
  background:var(--surface);color:var(--text);
  box-shadow:var(--raise-sm);
  transition:box-shadow .18s ease,transform .14s ease;
}
.preset:active{transform:translateY(1px)}
.preset:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.preset__preview{
  display:flex;gap:4px;align-items:center;justify-content:center;
  height:44px;border-radius:11px;margin-bottom:9px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}
.preset__preview i{width:15px;height:15px;border-radius:5px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.preset__name{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.preset__tag{display:block;font-size:10.5px;color:var(--text-dim);margin-top:2px;line-height:1.45}
.preset__check{
  position:absolute;top:9px;right:9px;width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);
  opacity:0;transform:scale(.4);transition:opacity .2s ease,transform .24s cubic-bezier(.2,.9,.3,1.5);
}
.preset__check svg{width:12px;height:12px;display:block}
.preset.is-on{box-shadow:var(--raise-sm), 0 0 0 2px var(--accent)}
.preset.is-on .preset__check{opacity:1;transform:scale(1)}

.crow{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  padding:10px 12px;border-radius:14px;margin-bottom:8px;
  background:var(--surface);box-shadow:var(--raise-sm);
}
.crow__label{flex:1;font-size:13.5px;font-weight:650;line-height:1.35}
.crow__label small{display:block;font-size:10.5px;font-weight:500;color:var(--text-dim);margin-top:2px}
.crow__hex{font-size:11.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.crow__chip{
  width:30px;height:30px;border-radius:10px;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.14);
}
.crow input[type="color"]{
  position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;
}
.crow.is-custom .crow__hex{color:var(--accent);font-weight:700}

/* =========================================================================
   7. 自适应
   ========================================================================= */
@media (max-height:640px){
  :root{--board:min(92vw,50svh,400px)}
  .brand h1{font-size:27px}
  .stat .value{font-size:18px}
  .btn{padding:10px 13px;font-size:13px}
  .card{padding:20px 18px}
}
@media (max-width:359px){
  .preset-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-delay:0ms !important}
}
</style>
</head>
<body>

<div class="ambient" id="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>2048</h1>
      <p>合并相同数字，冲击 2048</p>
    </div>
    <div class="actions">
      <!-- 自绘平面图标：滑杆＝外观设置，柱状＝历史战绩。颜色继承 --accent -->
      <button class="icon-btn" id="settingsBtn" title="外观设置" aria-label="外观设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <path d="M3.5 7.5h8M16.5 7.5h4M3.5 16.5h4M12.5 16.5h8"/>
          <circle cx="14" cy="7.5" r="2.6"/><circle cx="10" cy="16.5" r="2.6"/>
        </svg>
      </button>
      <button class="icon-btn" id="historyBtn" title="历史战绩" aria-label="历史战绩">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
          <path d="M5.5 19.5v-7M12 19.5v-15M18.5 19.5v-10"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="stats">
    <div class="stat" id="scoreBox">
      <span class="label">得分</span>
      <span class="value" id="scoreEl">0</span>
    </div>
    <div class="stat">
      <span class="label">最高</span>
      <span class="value" id="bestEl">0</span>
    </div>
    <div class="stat">
      <span class="label">局数</span>
      <span class="value" id="gamesEl">0</span>
    </div>
  </section>

  <div class="toolbar">
    <button class="btn primary" id="newBtn" title="将当前这局计入历史并开始新的一局">新游戏</button>
    <button class="btn" id="resetBtn" title="清空棋盘重开本局（不计入历史）">重置本局</button>
  </div>

  <div class="board" id="board">
    <div class="cells" id="cells"></div>
    <div class="tiles" id="tiles"></div>
  </div>

  <p class="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> / 手指滑动</p>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
(function () {
  'use strict';

  /* =======================================================================
     常量
     ======================================================================= */
  const SIZE  = 4;          // 4 × 4 网格
  const ANIM  = 110;        // 滑动动画时长(ms)，必须与 CSS 变量 --anim 一致
  const WIN   = 2048;       // 胜利目标
  const STORE = 'single-file-2048/v1';

  // 四个方向向量
  const VECTORS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },

  let settleTimer = null;   // 动画收尾定时器

  /* =======================================================================
     DOM
     ======================================================================= */

  const boardEl    = $('board');

  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement('div');

  /* =======================================================================
     配色系统
     -----------------------------------------------------------------------
     一个「配色预设」= 一组基础令牌（底色/面板/文字/强调色/阴影）+ 12 档方块色。
     用户还可以单独覆盖 强调色 / 背景色 / 文字色；一旦覆盖，就以该预设为骨架
     重新推导面板色、阴影色与整条方块色阶，保证新拟物的明暗关系始终成立。
     ======================================================================= */

  // --- 颜色工具 ---
  function hex2rgb(h) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(h).trim());
    return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 0, g: 0, b: 0 };
  }
  const rgb2hex = (r, g, b) => '#' + [r, g, b].map((v) =>
    Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  function mix(a, b, t) {
    const x = hex2rgb(a), y = hex2rgb(b);
    return rgb2hex(x.r + (y.r - x.r) * t, x.g + (y.g - x.g) * t, x.b + (y.b - x.b) * t);
  }
  /** 相对亮度 0~1，用来判断该配白字还是黑字 */
  function luminance(hex) {
    const c = hex2rgb(hex);
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
  }
  /** 两色的对比度（WCAG 公式），正文要求 ≥4.5，大号粗体 ≥3 */
  function contrast(a, b) {
    const la = luminance(a), lb = luminance(b);
    const hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }
  /**
   * 微调底色，直到它与指定字色达到目标对比度。
   * 方块色阶是「面板色 → 强调色」插值出来的，中间几档可能正好落在
   * 白字黑字都不够清楚的区间，这里统一兜底，预设和自定义都不会出现糊字。
   */
  function ensureContrast(bg, fg, target) {
    const toward = (fg === '#ffffff') ? '#000000' : '#ffffff';
    let c = bg;
    for (let i = 0; i < 16 && contrast(fg, c) < target; i++) c = mix(c, toward, 0.07);
    return c;
  }
  /** 按钮底色是 accent→accent-2 渐变，字色必须对两端都够清楚 */
  function pickAccentFg(a, b) {
    const w = Math.min(contrast('#ffffff', a), contrast('#ffffff', b));
    const d = Math.min(contrast('#1d1d1f', a), contrast('#1d1d1f', b));
    return d > w ? '#1d1d1f' : '#ffffff';
  }
  const rgba = (hex, a) => {
    const c = hex2rgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
  };
  /** 在给定底色上选一个能看清的字色 */
  const readableOn = (bg) => (luminance(bg) > 0.45 ? '#1d1d1f' : '#ffffff');
  /** 正文色：只改底色时必须跟着重算，否则「深色预设 + 浅色底」会白字白底看不清 */
  const autoText = (bg) => (luminance(bg) < 0.35 ? '#eef0f3' : '#1d1d1f');

        ['#b2bac9', '#14161a'], ['#c9d0dc', '#14161a'], ['#e2e7ef', '#14161a']]

  const DEFAULT_PRESET = 'graphite';
  let presetId = DEFAULT_PRESET;
  // 自定义覆盖：null = 跟随预设
  let custom = { accent: null, bg: null, text: null };

  const presetById = (id) => PRESETS.filter((p) => p.id === id)[0] || PRESETS[0];

  /**
   * 当前「实际生效」的三种颜色。
   * 关键规则：用户只改了底色、没改文字色时，文字色按新底色的明暗自动取深/浅，
   * 而不是沿用预设里的那个 —— 否则从深色预设切到浅色底会直接看不见字。
   */
  function effectiveColors() {
    const preset = presetById(presetId);
    const bg     = custom.bg     || preset.vars['--bg'];
    const accent = custom.accent || preset.vars['--accent'];
    const text   = custom.text   || (custom.bg ? autoText(bg) : preset.vars['--text']);
    return { preset: preset, bg: bg, accent: accent, text: text };
  }

  /**
   * 由「底色 + 强调色 + 文字色」重新推导整套令牌。
   * 新拟物的关键是：面板色必须和底色极接近，阴影必须是底色的深/浅两个方向，
   * 否则凸起/凹陷的错觉就散了 —— 所以自定义颜色时不能只换背景，必须整套重算。
   */
  function deriveVars(bg, accent, text, skeleton) {
    const dark = luminance(bg) < 0.35;
    const surface  = mix(bg, '#ffffff', dark ? 0.07 : 0.55);
    const surface2 = mix(bg, '#000000', dark ? 0.30 : 0.055);
    const boardBg  = mix(bg, '#000000', dark ? 0.18 : 0.045);
    const cellBg   = mix(bg, '#000000', dark ? 0.06 : 0.10);
    const shDark   = dark ? 'rgba(0,0,0,.72)' : rgba(mix(bg, '#000000', 0.62), 0.5);
    const shLight  = dark ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.97)';
    const accent2  = mix(accent, dark ? '#ffffff' : '#000000', 0.24);
    return {
      '--bg': bg,
      '--bg-2': mix(bg, '#ffffff', dark ? 0.06 : 0.5),
      '--surface': surface,
      '--surface-2': surface2,
      '--board-bg': boardBg,
      '--cell-bg': cellBg,
      '--text': text,
      '--text-dim': mix(text, bg, 0.42),
      '--accent': accent,
      '--accent-2': accent2,
      '--accent-fg': readableOn(accent),
      '--line': dark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.07)',
      '--sh-dark': shDark,
      '--sh-light': shLight,
      // 圆角与方块阴影沿用所选预设的性格
      '--radius': skeleton['--radius'],
      '--radius-lg': skeleton['--radius-lg'],
      '--tile-shadow': dark
        ? '3px 3px 8px rgba(0,0,0,.62), -2px -2px 6px rgba(255,255,255,.05)'
        : '3px 3px 8px var(--sh-dark), -2px -2px 6px var(--sh-light)'
    };
  }

  /** 沿着「面板色 → 强调色」插值出 12 档方块色，并自动决定黑字还是白字 */
  function deriveTiles(vars) {
    const base = vars['--surface'];
    const accent = vars['--accent'];
    const out = [null];
    for (let e = 1; e <= 12; e++) {
      const t = e <= 11 ? (e - 1) / 10 : 1;
      const amount = e <= 11 ? 0.10 + 0.78 * t : 1;
      const c = e <= 11 ? mix(base, accent, amount) : mix(accent, '#000000', 0.22);
      out[e] = [c, readableOn(c)];
    }
    return out;
  }

  /**
   * 自定义颜色模式下的氛围光晕：从强调色推 3 团，深浅底色分别给不同透明度。
   */
  function deriveGlows(vars) {
    const a = vars['--accent'];
    const dark = luminance(vars['--bg']) < 0.35;
    return [
      { c: rgba(a, dark ? 0.34 : 0.44), s: 72, x: -18, y: -22 },
      { c: rgba(mix(a, dark ? '#000000' : '#ffffff', 0.35), dark ? 0.28 : 0.38), s: 62, x: 52, y: 50 },
      { c: rgba(mix(a, dark ? '#ffffff' : '#000000', 0.22), dark ? 0.22 : 0.26), s: 54, x: 24, y: -16 }
    ];
  }

  /**
   * 把光晕清单写进 .ambient 里那 5 个固定 <i>。
   * glows 为空数组（深空黑）＝ 5 个全部设成透明，等于没有光晕。
   * DOM 复用而不是按需增删，是为了让换预设时颜色能渐变过渡。
   */
  function renderAmbient(glows) {
    const box = $('ambient');
    if (!box) return;
    const list = glows || [];
    const nodes = box.children;
    for (let i = 0; i < nodes.length; i++) {
      const el = nodes[i];
      const g = list[i];
      if (!g) { el.style.setProperty('background', 'transparent'); continue; }
      el.style.setProperty('left', g.x + '%');
      el.style.setProperty('top', g.y + '%');
      el.style.setProperty('width', g.s + 'vmax');
      el.style.setProperty('height', g.s + 'vmax');
      el.style.setProperty('background', g.c);
    }
  }

  function applyAppearance() {
    const preset = presetById(presetId);
    const hasCustom = !!(custom.accent || custom.bg || custom.text);
    let vars, tilesList, glows;

    if (!hasCustom) {
      vars = Object.assign({}, preset.vars);
      tilesList = preset.tiles;
      glows = preset.glows;
    } else {
      const c = effectiveColors();
      vars = deriveVars(c.bg, c.accent, c.text, preset.vars);
      tilesList = deriveTiles(vars);
      glows = deriveGlows(vars);
    }

    // 方块色阶 → --t2/--f2 … --t2048/--f2048 + --tsuper/--fsuper
    // 顺带把每一档的对比度兜到 3.5 以上，避免中间几档出现糊字
    const put = (key, pair) => {
      const bg = ensureContrast(pair[0], pair[1], 3.5);
      vars[key[0]] = bg;
      vars[key[1]] = pair[1];
    };
    for (let e = 1; e <= 11; e++) put(['--t' + (2 ** e), '--f' + (2 ** e)], tilesList[e]);
    put(['--tsuper', '--fsuper'], tilesList[12]);

    // 按钮字色按渐变的两端一起算，白字黑字哪个更清楚用哪个
    vars['--accent-fg'] = pickAccentFg(vars['--accent'], vars['--accent-2']);

    const st = document.documentElement.style;
    Object.keys(vars).forEach(function (k) { st.setProperty(k, vars[k]); });
    document.documentElement.dataset.preset = preset.id;
    renderAmbient(glows);

    const meta = $('metaTheme');
    if (meta) meta.setAttribute('content', vars['--bg']);

    return { preset: preset, vars: vars, tiles: tilesList, glows: glows, custom: hasCustom };
  }

  /* =======================================================================
     持久化
     ======================================================================= */
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        preset: presetId,
        custom: custom,
        best: best,
        history: history
      }));
    } catch (e) { /* 隐私模式等场景忽略 */ }
  }
  function load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
    if (!data || typeof data !== 'object') return;
    best    = Number(data.best) || 0;
    history = Array.isArray(data.history) ? data.history.slice(0, 50) : [];
    if (typeof data.preset === 'string' && PRESETS.some(function (p) { return p.id === data.preset; })) {
      presetId = data.preset;
    }
    if (data.custom && typeof data.custom === 'object') {
      ['accent', 'bg', 'text'].forEach(function (k) {
        const v = data.custom[k];
        custom[k] = (typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v)) ? v : null;
      });
    }
  }

  /* =======================================================================
     平面化自绘图标（统一 currentColor，跟随强调色）
     ======================================================================= */
  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v5.2a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 5.6H5.2a.7.7 0 0 0-.7.7c0 2.1 1.4 3.6 3.2 3.7M16.5 5.6h2.3a.7.7 0 0 1 .7.7c0 2.1-1.4 3.6-3.2 3.7"/><path d="M12 13.7V17M8.8 20.2h6.4l-.7-3.2H9.5z"/></svg>',
    bars: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5.5 19.5v-7M12 19.5v-15M18.5 19.5v-10"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 5.2h9.4l-1.3 3.3a1 1 0 0 0 0 .76l1.3 3.3H6z"/></svg>',
    sliders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3.5 7.5h8M16.5 7.5h4M3.5 16.5h4M12.5 16.5h8"/><circle cx="14" cy="7.5" r="2.6"/><circle cx="10" cy="16.5" r="2.6"/></svg>'
  };

  /* =======================================================================
     网格辅助

     【核心：网格合并算法】
     数据结构与经典 2048 一致，分四步：
       1) 由 tiles 生成 4×4 的 grid 引用矩阵（空格为 null）；
       2) 按“移动方向”决定遍历顺序 —— 靠近目标边界的格子先处理，
          保证同一行/列里的方块不会越过前一个方块或被重复合并；
       3) 对每个方块找出该方向上“最远可到达的空格(farthest)”以及
          “再往前一格(next)”——next 格若存在，一定是挡路的方块；
       4) 若 next 方块数值相同且本回合尚未合并过(mergedThisTurn)，
          则合并；否则平移到 farthest。合并后立刻把结果方块的
          mergedThisTurn 置为 true，从而禁止它在同一回合被二次合并
          （例如 [2,2,4] 向左应得 [4,4] 而不是 [8]）。
     ======================================================================= */

  // 1) 生成 4×4 引用矩阵（忽略已标记 dead 的方块）
  function makeGrid() {
    const g = [];
    for (let y = 0; y < SIZE; y++) g.push(new Array(SIZE).fill(null));
    for (const t of tiles) {
      if (!t.dead) g[t.y][t.x] = t;
    }
    return g;
  }

  // 3) 找出 (x,y) 沿方向 v 的最远空格与前方阻挡格
  function findFarthest(grid, x, y, v) {
    let fx = x, fy = y;              // 最远可达的空格（初始为自身）
    let nx = x + v.x, ny = y + v.y;  // 探针
    while (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && !grid[ny][nx]) {
      fx = nx; fy = ny;
      nx += v.x; ny += v.y;
    }
    const inBoard = nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE;
    return {
      farthest: { x: fx, y: fy },
      next: inBoard ? { x: nx, y: ny } : null   // 越界则为 null
    };
  }

  // 某个坐标是否为空
  function emptyCells() {
    const g = makeGrid(), out = [];
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (!g[y][x]) out.push({ x, y });
    return out;
  }

  // 在随机空格生成新数字：90% 概率 2，10% 概率 4
  function addRandomTile() {
    const free = emptyCells();
    if (!free.length) return null;
    const spot = free[Math.floor(Math.random() * free.length)];
    const t = {
      id: ++uid,
      value: Math.random() < 0.9 ? 2 : 4,
      x: spot.x, y: spot.y,
      dead: false,
      isNew: true,             // 触发 CSS 出现动画
      justMerged: false,
      mergedThisTurn: false
    };
    tiles.push(t);
    return t;
  }

  /* =======================================================================
     渲染：把状态同步到 DOM（位移靠 CSS transition 完成）
     ======================================================================= */
  function paint(el, value) {
    const inner = el.firstChild;
    const s = String(value);
    if (inner.textContent !== s) inner.textContent = s;
    const key = value <= WIN ? s : 'super';
    if (el.dataset.v !== key) el.dataset.v = key;
    // 位数越多字号越小，保证大数字不出格
    inner.style.fontSize =
      s.length <= 2 ? 'calc(var(--cell) * .44)' :
      s.length === 3 ? 'calc(var(--cell) * .33)' :
      s.length === 4 ? 'calc(var(--cell) * .25)' :
                       'calc(var(--cell) * .20)';
  }

  function syncDOM() {
    const alive = new Set();

    for (const t of tiles) {
      alive.add(t.id);
      let el = elMap.get(t.id);

      if (!el) {
        // 新元素：先设好坐标再插入文档，避免从 (0,0) 滑入的假动画
        el = document.createElement('div');
        el.className = 'tile';
        el.innerHTML = '<div class="tile-inner"></div>';
        el.style.setProperty('--x', t.x);
        el.style.setProperty('--y', t.y);
        paint(el, t.value);
        // 动画结束后清掉标记类，保证下次能重新播放
        el.addEventListener('animationend', function (ev) {
          if (ev.target === el.firstChild) el.classList.remove('new', 'merged');
        });
        elMap.set(t.id, el);
        tilesEl.appendChild(el);
      } else {
        // 已存在的元素：只改坐标 → 浏览器自动补间出滑动位移
        el.style.setProperty('--x', t.x);
        el.style.setProperty('--y', t.y);
        paint(el, t.value);
      }

      el.dataset.dead = t.dead ? '1' : '0';

      if (t.isNew) {
        t.isNew = false;
        el.classList.add('new');
      }
      if (t.justMerged) {
        t.justMerged = false;
        el.classList.remove('merged');
        void el.offsetWidth;        // 强制回流，让动画可以重播
        el.classList.add('merged');
      }
    }

    // 回收已消失的方块
    elMap.forEach(function (el, id) {
      if (!alive.has(id)) { el.remove(); elMap.delete(id); }
    });
  }

  /* =======================================================================
     计分 UI
     ======================================================================= */
  function renderStats() {
    scoreEl.textContent = score;
    bestEl.textContent  = best;
    gamesEl.textContent = history.length;
  }

  function flashScore(gain) {
    if (!gain) return;
    const old = scoreBox.querySelector('.score-add');
    if (old) old.remove();
    const s = document.createElement('span');
    s.className = 'score-add';
    s.textContent = '+' + gain;
    scoreBox.appendChild(s);
    setTimeout(function () { s.remove(); }, 780);
  }

  /* =======================================================================
     走一步（唯一的状态变更入口）
     ======================================================================= */
  function move(dir) {
    if (locked || over || modalOpen) return;

    const v = VECTORS[dir];
    if (!v) return;

    const grid = makeGrid();

    // 2) 遍历顺序：越靠近目标边界的格子越先处理
    const xOrder = v.x === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const yOrder = v.y === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];

    // 每回合重置合并标记
    for (const t of tiles) { t.mergedThisTurn = false; t.justMerged = false; }

    let moved = false, gained = 0, reachedWin = false;

    for (const y of yOrder) {
      for (const x of xOrder) {
        const tile = grid[y][x];
        if (!tile) continue;

        const res = findFarthest(grid, x, y, v);
        const far = res.farthest;
        const blocker = res.next ? grid[res.next.y][res.next.x] : null;

        if (blocker && blocker.value === tile.value && !blocker.mergedThisTurn) {
          /* ---- 合并 ---------------------------------------------------
             blocker 作为“存活方块”留在原地，数值翻倍；
             tile 标记 dead 并滑到 blocker 所在格，动画结束后再销毁。
             存活方块叠加 .merged 类，滑行结束的瞬间播放缩放 + 闪光。 */
          blocker.value *= 2;
          blocker.mergedThisTurn = true;   // 禁止本回合二次合并
          blocker.justMerged = true;

          grid[y][x] = null;
          tile.dead = true;
          tile.x = res.next.x;
          tile.y = res.next.y;

          gained += blocker.value;
          if (blocker.value === WIN) reachedWin = true;
          moved = true;

        } else if (far.x !== x || far.y !== y) {
          /* ---- 平移：滑到该方向上最远的空格 ---- */
          grid[y][x] = null;
          grid[far.y][far.x] = tile;
          tile.x = far.x;
          tile.y = far.y;
          moved = true;
        }
      }
    }

    if (!moved) return;   // 没有任何方块移动 → 不生成新数字、不计步

    /* ---- 先播放滑动位移 ---- */
    moves++;
    score += gained;
    if (score > best) best = score;
    renderStats();
    flashScore(gained);
    syncDOM();

    locked = true;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () {
      /* ---- 滑动结束后收尾 ---- */
      tiles = tiles.filter(function (t) { return !t.dead; });  // 销毁被吞并的方块
      tiles.forEach(function (t) { t.isNew = false; });
      addRandomTile();          // 新数字随机生成
      syncDOM();

      locked = false;
      save();

      if (reachedWin && !won) {
        won = true;
        save();
        showWin();
      } else if (isGameOver()) {
        over = true;
        recordGame();
        showGameOver();
      }
    }, ANIM);
  }

  /* =======================================================================
     终局判定：无空格且相邻无相同数字
     ======================================================================= */
  function isGameOver() {
    const g = makeGrid();
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const t = g[y][x];
        if (!t) return false;                                   // 还有空格
        // 邻居可能是空格(null)，必须先判空再取值
        const right = x + 1 < SIZE ? g[y][x + 1] : null;
        const down  = y + 1 < SIZE ? g[y + 1][x] : null;
        if (right && right.value === t.value) return false;     // 右边可合并
        if (down  && down.value  === t.value) return false;     // 下边可合并
      }
    }
    return true;
  }

  function maxTile() {
    let m = 0;
    for (const t of tiles) if (!t.dead && t.value > m) m = t.value;
    return m;
  }

  /* =======================================================================
     历史战绩
     ======================================================================= */
  function recordGame() {
    if (recorded || moves === 0) return;
    recorded = true;
    history.unshift({
      score: score,
      max: maxTile(),
      moves: moves,
      date: Date.now()
    });
    history = history.slice(0, 50);
    if (score > best) best = score;
    save();
    renderStats();
  }

  function fmtDate(ts) {
    const d = new Date(ts), p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* =======================================================================
     弹窗
     ======================================================================= */
  function openModal(html, wire, dismissible) {
    cardEl.innerHTML = html;
    overlayEl.dataset.dismissible = dismissible ? '1' : '0';
    overlayEl.classList.add('show');
    modalOpen = true;
    if (wire) wire(cardEl);
  }
  function closeModal() {
    overlayEl.classList.remove('show');
    modalOpen = false;
  }

  overlayEl.addEventListener('click', function (e) {
    if (e.target === overlayEl && overlayEl.dataset.dismissible === '1') closeModal();
  });

  function showWin() {
    openModal(
      '<span class="mark">' + ICON.trophy + '</span>' +
      '<h2>达成 2048！</h2>' +
      '<p class="muted">本局得分 <b>' + score + '</b> · 最高数字 <b>2048</b></p>' +
      '<div class="card-actions">' +
        '<button class="btn" data-act="continue">继续挑战</button>' +
        '<button class="btn primary" data-act="new">再来一局</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="continue"]').onclick = closeModal;
        root.querySelector('[data-act="new"]').onclick = function () { closeModal(); newGame(true); };
      });
  }

  function showGameOver() {
    openModal(
      '<span class="mark">' + ICON.flag + '</span>' +
      '<h2>Game Over</h2>' +
      '<p class="muted">无处可走了 · 本局得分</p>' +
      '<div class="big">' + score + '</div>' +
      '<p class="muted">最高数字 ' + maxTile() + ' · 共 ' + moves + ' 步 · 历史第 ' + history.length + ' 局</p>' +
      '<div class="card-actions">' +
        '<button class="btn" data-act="hist">历史战绩</button>' +
        '<button class="btn primary" data-act="new">重新开始</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="new"]').onclick = function () { closeModal(); newGame(false); };
        root.querySelector('[data-act="hist"]').onclick = showHistory;
      });
  }

  function showHistory() {
    let rows;
    if (history.length) {
      rows = history.map(function (r, i) {
        return '<li>' +
          '<span class="idx">#' + (history.length - i) + '</span>' +
          '<span class="sc">' + r.score + '</span>' +
          '<span class="meta">最大 ' + (r.max || '-') + ' · ' + r.moves + ' 步<br>' + fmtDate(r.date) + '</span>' +
        '</li>';
      }).join('');
    } else {
      rows = '<li class="empty">还没有历史记录，先玩一局吧</li>';
    }

    openModal(
      '<span class="mark">' + ICON.bars + '</span>' +
      '<h2>历史战绩</h2>' +
      '<p class="muted">已完成 <b>' + history.length + '</b> 局 · 最高分 <b>' + best + '</b></p>' +
      '<ul class="hist">' + rows + '</ul>' +
      '<div class="card-actions">' +
        '<button class="btn" data-act="clear">清空记录</button>' +
        '<button class="btn primary" data-act="close">关闭</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="close"]').onclick = closeModal;
        root.querySelector('[data-act="clear"]').onclick = function () {
          if (!history.length) return;
          history = [];
          save();
          renderStats();
          showHistory();
        };
      }, true);
  }

  /* =======================================================================
     外观设置弹窗（不跳转页面，直接在当前页覆盖一层）
     ======================================================================= */
  function presetCardHTML(p, active) {
    const dots = [1, 5, 8, 11].map(function (e) {
      return '<i style="background:' + p.tiles[e][0] + '"></i>';
    }).join('');
    return '<button class="preset' + (active ? ' is-on' : '') + '" type="button" data-preset="' + p.id + '">' +
      '<span class="preset__preview" style="background:' + p.vars['--bg'] + '">' + dots + '</span>' +
      '<span class="preset__name">' + p.name + '</span>' +
      '<span class="preset__tag">' + p.tag + '</span>' +
      '<span class="preset__check">' + ICON.check + '</span>' +
    '</button>';
  }

  function colorRowHTML(key, label, hint, value, isCustom) {
    return '<label class="crow' + (isCustom ? ' is-custom' : '') + '">' +
      '<span class="crow__label">' + label + '<small>' + hint + '</small></span>' +
      '<span class="crow__hex">' + value + '</span>' +
      '<span class="crow__chip" style="background:' + value + '"></span>' +
      '<input type="color" data-color="' + key + '" value="' + value + '">' +
    '</label>';
  }

  function showSettings() {
    const c = effectiveColors();

    openModal(
      '<div class="set">' +
        '<div class="set-head">' +
          '<span class="mark">' + ICON.sliders + '</span>' +
          '<div><h2>外观设置</h2><p>选一套配色预设，或自己挑三种颜色</p></div>' +
        '</div>' +

        '<h3 class="set-title">配色预设</h3>' +
        '<div class="preset-grid">' +
          PRESETS.map(function (p) { return presetCardHTML(p, p.id === presetId); }).join('') +
        '</div>' +

        '<h3 class="set-title">自定义颜色</h3>' +
        '<div class="custom-list">' +
          colorRowHTML('accent', '强调色', '按钮、图标与高亮', c.accent, !!custom.accent) +
          colorRowHTML('bg', '背景色', '面板与阴影会跟着自动推导', c.bg, !!custom.bg) +
          colorRowHTML('text', '文字色', '只改底色时文字色会自动适配', c.text, !!custom.text) +
        '</div>' +
        '<button class="btn ghost" type="button" data-act="resetColors" style="width:100%;margin-top:4px">' +
          '清除自定义颜色，回到预设</button>' +

        '<div class="card-actions">' +
          '<button class="btn" data-act="resetAll">恢复默认外观</button>' +
          '<button class="btn primary" data-act="close">完成</button>' +
        '</div>' +
      '</div>',
      function (root) {
        root.querySelectorAll('.preset').forEach(function (btn) {
          btn.onclick = function () {
            presetId = btn.dataset.preset;
            custom = { accent: null, bg: null, text: null };   // 换预设即清空自定义覆盖
            applyAppearance();
            save();
            showSettings();                                    // 重绘，刷新选中态与色值
          };
        });

        root.querySelectorAll('input[data-color]').forEach(function (inp) {
          const key = inp.dataset.color;
          // input 事件 = 拖动取色器时实时预览；change = 松手落定
          inp.oninput = function () { custom[key] = inp.value; applyAppearance(); };
          inp.onchange = function () { custom[key] = inp.value; applyAppearance(); save(); showSettings(); };
        });

        root.querySelector('[data-act="resetColors"]').onclick = function () {
          custom = { accent: null, bg: null, text: null };
          applyAppearance();
          save();
          showSettings();
        };
        root.querySelector('[data-act="resetAll"]').onclick = function () {
          presetId = DEFAULT_PRESET;
          custom = { accent: null, bg: null, text: null };
          applyAppearance();
          save();
          showSettings();
        };
        root.querySelector('[data-act="close"]').onclick = closeModal;
      }, true);
  }

  /* =======================================================================
     开局 / 重置
     ======================================================================= */
  function newGame(record) {
    if (record) recordGame();     // 把当前这局写进历史
    closeModal();
    clearTimeout(settleTimer);

    tiles = [];
    elMap.forEach(function (el) { el.remove(); });
    elMap.clear();
    tilesEl.innerHTML = '';

    score = 0; moves = 0;
    locked = false; won = false; over = false; recorded = false;

    addRandomTile();
    addRandomTile();
    syncDOM();
    renderStats();
    save();
  }

  function resetCurrent() {
    // 重置本局：丢弃当前棋盘，但不写入历史
    newGame(false);
  }

  /* =======================================================================
     事件绑定
     ======================================================================= */
  const KEYMAP = {
    arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    k: 'up', j: 'down', h: 'left', l: 'right'
  };

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = (e.key || '').toLowerCase();
    const dir = KEYMAP[key];
    if (dir) {
      e.preventDefault();
      move(dir);
    } else if (key === 'escape') {
      closeModal();
    }
  }, { passive: false });

  // 触屏滑动
  let startX = 0, startY = 0, tracking = false;
  const THRESHOLD = 22;   // 最小滑动距离(px)

  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (tracking) e.preventDefault();   // 阻止页面滚动 / 下拉刷新
  }, { passive: false });

  boardEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < THRESHOLD) return;         // 视为点击
    if (ax > ay) move(dx > 0 ? 'right' : 'left');
    else         move(dy > 0 ? 'down'  : 'up');
  });

  boardEl.addEventListener('touchcancel', function () { tracking = false; });

  // 鼠标拖拽（桌面端可选操作）
  let dragX = 0, dragY = 0, dragging = false;
  boardEl.addEventListener('mousedown', function (e) {
    dragging = true; dragX = e.clientX; dragY = e.clientY;
  });
  window.addEventListener('mouseup', function (e) {
    if (!dragging) return;
    dragging = false;
    const dx = e.clientX - dragX, dy = e.clientY - dragY;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 40) return;
    if (ax > ay) move(dx > 0 ? 'right' : 'left');
    else         move(dy > 0 ? 'down'  : 'up');
  });

  // 按钮
  $('newBtn').addEventListener('click', function () { newGame(true); });
  $('resetBtn').addEventListener('click', function () { resetCurrent(); });
  $('historyBtn').addEventListener('click', showHistory);
  $('settingsBtn').addEventListener('click', showSettings);

  /* =======================================================================
     启动
     ======================================================================= */
  load();
  applyAppearance();
  newGame(false);
})();
</script>
</body>
</html>
